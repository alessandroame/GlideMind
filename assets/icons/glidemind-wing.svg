      L 168,230
      C 188,198 220,166 268,154
      C 318,142 380,133 434,130
      C 440,130 442,135 438,139
      C 422,156 395,182 388,188
      C 348,202 294,216 244,233
      C 205,246 172,274 154,308
      L 106,346
      C 104,348 103,348 102,348
      Z
    " />

    <!-- 2. Middle Feather -->
    <path fill="url(#gm-wing-grad)" d="
      M 184,286
      C 180,286 178,282 181,278
      C 192,266 215,254 246,246
      C 292,234 350,224 394,222
      C 400,222 402,227 398,232
      C 384,248 368,266 362,272
      C 328,283 274,295 228,302
      C 208,305 194,302 184,286
