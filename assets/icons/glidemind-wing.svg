<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gm-wing-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="gm-wing-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="
        1 0 0 0 0.96
        0 1 0 0 0.62
        0 0 1 0 0.04
        0 0 0 0.42 0" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#gm-wing-glow)">
    <!-- 1. Top Wing (Swept Leading Edge & Apex Feather) -->
    <path fill="url(#gm-wing-grad)" d="
