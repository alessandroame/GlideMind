    " />

    <!-- 3. Bottom Feather -->
    <path fill="url(#gm-wing-grad)" d="
      M 134,348
      L 186,294
      C 190,290 196,290 202,292
      C 236,300 286,308 334,312
      C 340,312 342,317 338,322
      C 326,334 316,342 308,348
